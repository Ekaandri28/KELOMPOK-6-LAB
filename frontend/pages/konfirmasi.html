<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesanan Dikonfirmasi — Live Shopping Kosmetik</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .confirm-wrapper {
      min-height: 80vh; display: flex;
      align-items: center; justify-content: center;
    }
    .confirm-card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 36px 32px;
      width: 90%; max-width: 500px; text-align: center;
    }
    .confirm-icon { font-size: 4rem; margin-bottom: 12px; }
    .confirm-title { font-size: 1.5rem; font-weight: 700; color: var(--green); margin-bottom: 8px; }
    .confirm-subtitle { color: var(--gray-600); margin-bottom: 24px; }
    .order-detail { text-align: left; border-top: 1px solid var(--gray-200); padding-top: 16px; }
    .order-row {
      display: flex; justify-content: space-between;
      padding: 6px 0; border-bottom: 1px solid var(--gray-200);
      font-size: .9rem;
    }
    .order-row:last-child { border-bottom: none; }
    .order-row .label { color: var(--gray-600); }
    .order-row .value { font-weight: 600; }
    .order-total { font-size: 1.1rem; color: var(--pink-dark); }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="brand">💄 KosmetikLive</div>
  <div class="nav-links">
    <a href="pelanggan.html">Lanjut Belanja</a>
    <a href="pesanan.html">📦 Pesanan Saya</a>
  </div>
</nav>

<div class="confirm-wrapper">
  <div class="confirm-card" id="confirm-card">
    <div class="confirm-icon">✅</div>
    <div class="confirm-title">Pesanan Dikonfirmasi!</div>
    <div class="confirm-subtitle">Terima kasih! Pesananmu sedang diproses.</div>

    <div class="order-detail" id="order-detail">
      <div style="text-align:center;color:#999;padding:16px">Memuat detail pesanan...</div>
    </div>

    <div style="display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap">
      <a href="pesanan.html" class="btn btn-secondary">📦 Lihat Semua Pesanan</a>
      <a href="pelanggan.html" class="btn btn-primary">💄 Lanjut Belanja</a>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  if (localStorage.getItem('role') !== 'pelanggan') window.location.href = '../index.html';

  const fmt = n => 'Rp ' + Number(n).toLocaleString('id-ID');

  function renderOrder(order) {
    if (!order) {
      document.getElementById('order-detail').innerHTML =
        '<div style="color:#999;text-align:center">Tidak ada data pesanan.</div>';
      return;
    }
    const items = order.items || [];
    document.getElementById('order-detail').innerHTML = `
      <div class="order-row">
        <span class="label">No. Pesanan</span>
        <span class="value">#${order.id}</span>
      </div>
      <div class="order-row">
        <span class="label">Nama</span>
        <span class="value">${order.customer_name}</span>
      </div>
      <div class="order-row">
        <span class="label">Email</span>
        <span class="value">${order.customer_email}</span>
      </div>
      <div class="order-row">
        <span class="label">Status</span>
        <span class="value"><span class="status-badge status-${order.status}">${order.status}</span></span>
      </div>
      ${order.payment_method ? `
      <div class="order-row">
        <span class="label">Metode Bayar</span>
        <span class="value">✅ ${order.payment_method}</span>
      </div>` : ''}
      <div style="margin:12px 0;font-weight:700;font-size:.9rem">Produk Dipesan:</div>
      ${items.map(i => `
        <div class="order-row">
          <span class="label">${i.name} ×${i.qty}</span>
          <span class="value">${fmt(i.unit_price * i.qty)}</span>
        </div>`).join('')}
      <div class="order-row order-total" style="margin-top:8px">
        <span class="label" style="font-weight:700">Total Pembayaran</span>
        <span class="value">${fmt(order.total_price)}</span>
      </div>
      <div class="order-row">
        <span class="label">Waktu Pesanan</span>
        <span class="value">${new Date(order.created_at).toLocaleString('id-ID')}</span>
      </div>`;
  }

  // Ambil last_order dari localStorage (disimpan saat checkout)
  const lastOrder = JSON.parse(localStorage.getItem('last_order') || 'null');
  if (lastOrder) {
    renderOrder(lastOrder);
    // Coba ambil data terbaru dari API
    OrderAPI.getOne(lastOrder.id).then(res => renderOrder(res.data)).catch(() => {});
  } else {
    document.getElementById('order-detail').innerHTML =
      '<div style="text-align:center;padding:16px;color:#999">Tidak ada data pesanan tersimpan.<br/><a href="pesanan.html">Lihat riwayat pesanan</a></div>';
  }
</script>
</body>
</html>
