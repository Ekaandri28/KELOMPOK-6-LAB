<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang & Checkout — Live Shopping Kosmetik</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="brand">💄 KosmetikLive <span>Keranjang</span></div>
  <div class="nav-links">
    <a href="pelanggan.html">← Lanjut Belanja</a>
    <button onclick="logout()">Keluar</button>
  </div>
</nav>

<div class="container">
  <div style="display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start" id="main-layout">

    <!-- KERANJANG -->
    <div>
      <div class="page-title">🛒 Keranjang Belanja</div>
      <div class="card" id="cart-area">
        <div style="text-align:center;color:#999;padding:32px">Keranjang kosong</div>
      </div>
    </div>

    <!-- CHECKOUT FORM -->
    <div>
      <div class="page-title">📋 Detail Pemesanan</div>
      <div class="card">
        <div id="alert-area"></div>
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input id="cust-name" placeholder="Siti Aminah" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="cust-email" required />
        </div>

        <hr style="margin:16px 0;border:none;border-top:1px solid var(--gray-200)" />

        <div style="font-weight:700;margin-bottom:10px">Ringkasan Pesanan</div>
        <div id="summary-items" style="font-size:.9rem;color:var(--gray-600)"></div>
        <div class="cart-total" id="summary-total">Total: Rp 0</div>

        <hr style="margin:16px 0;border:none;border-top:1px solid var(--gray-200)" />

        <!-- Simulasi Pembayaran -->
        <div class="form-group">
          <label>Metode Pembayaran</label>
          <select id="payment-method">
            <option>Transfer Bank (BCA)</option>
            <option>Transfer Bank (Mandiri)</option>
            <option>GoPay</option>
            <option>OVO</option>
            <option>Dana</option>
            <option>ShopeePay</option>
          </select>
        </div>

        <button class="btn btn-primary" style="width:100%;margin-top:8px;padding:13px;font-size:1rem"
          id="btn-checkout" onclick="doCheckout()">
          Bayar Sekarang
        </button>
        <div id="checkout-loading" style="display:none;text-align:center;padding:12px;color:var(--gray-600)">
          ⏳ Memproses pesanan, mohon tunggu...
        </div>
      </div>
    </div>

  </div>
</div>

<script src="../js/api.js"></script>
<script>
  // ── AUTH CHECK ───────────────────────────────────────────────
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (localStorage.getItem('role') !== 'pelanggan') window.location.href = '../index.html';

  // Pre-fill email dari user login
  document.getElementById('cust-email').value = user.email || '';

  function logout() {
    localStorage.removeItem('role');
    localStorage.removeItem('user');
    window.location.href = '../index.html';
  }

  // ── CART ─────────────────────────────────────────────────────
  function getCart() { return JSON.parse(localStorage.getItem('cart') || '[]'); }
  function saveCart(c) { localStorage.setItem('cart', JSON.stringify(c)); renderCart(); }

  const fmt = n => 'Rp ' + Number(n).toLocaleString('id-ID');
  const emojiKat = {
    'Lipstik':'💄', 'Foundation':'🫧', 'Skincare':'🧴',
    'Mata':'👁️', 'Pipi':'🌸', 'Setting':'✨', 'Primer':'🫙',
    'Cushion':'🪞', 'Eyeshadow':'👁️', 'Blush On':'🌸', 'Lainnya':'✨'
  };

  function renderCart() {
    const cart = getCart();
    const area = document.getElementById('cart-area');

    if (!cart.length) {
      area.innerHTML = `<div class="empty-state">
        <div class="empty-icon">🛒</div>
        <p>Keranjang kosong</p>
        <a href="pelanggan.html" class="btn btn-primary" style="margin-top:12px">Belanja Sekarang</a>
      </div>`;
      document.getElementById('btn-checkout').disabled = true;
      document.getElementById('summary-items').innerHTML = '<em>Belum ada item</em>';
      document.getElementById('summary-total').textContent = 'Total: Rp 0';
      return;
    }

    document.getElementById('btn-checkout').disabled = false;

    area.innerHTML = cart.map((item, idx) => `
      <div class="cart-item">
        <div class="cart-emoji">${emojiKat[item.category]||'✨'}</div>
        <div class="cart-info">
          <div class="cart-name">${item.name}</div>
          <div class="cart-price">
            ${item.flash_price
              ? `<span style="color:var(--red);font-weight:700">${fmt(item.flash_price)}</span>
                 <span style="text-decoration:line-through;color:#999;font-size:.85rem;margin-left:4px">${fmt(item.normal_price)}</span>`
              : fmt(item.unit_price)}
          </div>
        </div>
        <div class="cart-qty">
          <button onclick="changeQty(${idx}, -1)">−</button>
          <span style="font-weight:700;min-width:20px;text-align:center">${item.qty}</span>
          <button onclick="changeQty(${idx}, 1)">+</button>
        </div>
        <div style="font-weight:700;min-width:90px;text-align:right">${fmt(item.unit_price * item.qty)}</div>
        <button onclick="removeItem(${idx})" style="background:none;border:none;font-size:1.2rem;color:#999;cursor:pointer">✕</button>
      </div>`).join('') + `<div style="text-align:right;margin-top:8px">
        <button onclick="clearCart()" style="background:none;border:none;color:var(--gray-600);font-size:.85rem;cursor:pointer;text-decoration:underline">Kosongkan Keranjang</button>
      </div>`;

    // Summary
    const total = cart.reduce((s, i) => s + i.unit_price * i.qty, 0);
    document.getElementById('summary-items').innerHTML = cart.map(i =>
      `<div style="display:flex;justify-content:space-between;margin-bottom:4px">
         <span>${i.name} ×${i.qty}</span>
         <span>${fmt(i.unit_price * i.qty)}</span>
       </div>`).join('');
    document.getElementById('summary-total').textContent = 'Total: ' + fmt(total);
  }

  function changeQty(idx, delta) {
    const cart = getCart();
    cart[idx].qty = Math.max(1, cart[idx].qty + delta);
    saveCart(cart);
  }

  function removeItem(idx) {
    const cart = getCart();
    cart.splice(idx, 1);
    saveCart(cart);
  }

  function clearCart() {
    if (confirm('Kosongkan semua keranjang?')) {
      localStorage.removeItem('cart');
      renderCart();
    }
  }

  // ── ALERT ────────────────────────────────────────────────────
  function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert-area');
    el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    if (type !== 'error') setTimeout(() => el.innerHTML = '', 4000);
  }

  // ── CHECKOUT ─────────────────────────────────────────────────
  async function doCheckout() {
    const name  = document.getElementById('cust-name').value.trim();
    const email = document.getElementById('cust-email').value.trim();
    const cart  = getCart();

    if (!name)  { showAlert('Masukkan nama lengkap.'); return; }
    if (!email) { showAlert('Masukkan email.'); return; }
    if (!cart.length) { showAlert('Keranjang kosong.'); return; }

    // Sembunyikan tombol, tampilkan loading
    document.getElementById('btn-checkout').style.display    = 'none';
    document.getElementById('checkout-loading').style.display = '';

    const body = {
      customer_name:  name,
      customer_email: email,
      items: cart.map(i => ({ product_id: i.product_id, qty: i.qty })),
    };

    try {
      // Simulasi proses pembayaran (delay 1.5 detik)
      await new Promise(r => setTimeout(r, 1500));

      // Panggil order-service
      const res = await OrderAPI.create(body);
      const order = res.data;

      // Simpan last order untuk halaman konfirmasi
      localStorage.setItem('last_order', JSON.stringify(order));
      // Kosongkan keranjang
      localStorage.removeItem('cart');

      // Redirect ke halaman konfirmasi
      window.location.href = 'konfirmasi.html';

    } catch (e) {
      document.getElementById('btn-checkout').style.display    = '';
      document.getElementById('checkout-loading').style.display = 'none';

      if (e.message.includes('Stok') || e.message.includes('409') || e.message.includes('stok')) {
        showAlert('❌ Stok tidak mencukupi untuk salah satu produk. Silakan periksa keranjang kamu.');
      } else if (e.message.includes('tidak ditemukan') || e.message.includes('404')) {
        showAlert('❌ Salah satu produk tidak ditemukan. Mungkin sudah dihapus.');
      } else {
        showAlert('❌ Gagal membuat pesanan: ' + e.message + '<br/><small>Pastikan semua service berjalan.</small>');
      }
    }
  }

  // Responsive: stack di layar kecil
  if (window.innerWidth < 700) {
    document.getElementById('main-layout').style.gridTemplateColumns = '1fr';
  }

  // ── INIT ─────────────────────────────────────────────────────
  renderCart();
</script>
</body>
</html>
